name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    name: Validate · a11y · Lighthouse · links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- 1. Markup -------------------------------------------------------
      # Mirrors the local gate: npx html-validate index.html case-study.html
      - name: html-validate
        run: npx --yes html-validate index.html case-study.html

      # ---- 2-4. Serve + audit ---------------------------------------------
      # axe drives Chrome through ChromeDriver, and the two must be the same
      # major version. The runner's preinstalled Chrome updates on its own
      # schedule while @axe-core/cli pulls the newest ChromeDriver, so they
      # drift apart and the run fails with "This version of ChromeDriver only
      # supports Chrome version N". browser-driver-manager installs a matched
      # pair; we point axe at both explicitly.
      #
      # (The first version of this comment blamed the server dying between
      # steps. The job log disproves that: "server up, gzip confirmed" printed
      # before the ChromeDriver error.)
      - name: Serve, then axe + Lighthouse
        run: |
          set -euo pipefail

          npx --yes browser-driver-manager@2.0.1 install chrome
          set -a; . "$HOME/.browser-driver-manager/.env"; set +a
          # The README shows home-relative paths; accept absolute ones too.
          abs() { case "$1" in /*) echo "$1" ;; *) echo "$HOME/$1" ;; esac; }
          CHROME_BIN=$(abs "$CHROME_TEST_PATH")
          DRIVER_BIN=$(abs "$CHROMEDRIVER_TEST_PATH")
          "$CHROME_BIN" --version
          "$DRIVER_BIN" --version

          python3 tools/serve-gzip.py 4174 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4174/ && break
            sleep 1
          done
          HDRS=$(curl -sI -H 'Accept-Encoding: gzip' http://localhost:4174/)
          echo "$HDRS" | grep -qi 'content-encoding: gzip'
          echo "server up, gzip confirmed"

          npx --yes @axe-core/cli \
            http://localhost:4174/ \
            http://localhost:4174/case-study.html \
            --chrome-path "$CHROME_BIN" \
            --chromedriver-path "$DRIVER_BIN" \
            --exit --save axe-report.json

          CHROME_PATH="$CHROME_BIN" npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}

      # ---- 5. Links ---------------------------------------------------------
      - name: lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --exclude-path docs/audit
            index.html case-study.html
          fail: true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            axe-report.json
            .lighthouseci/
          retention-days: 14

  deploy:
    name: Deploy to Pages
    needs: audit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
